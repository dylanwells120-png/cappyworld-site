# Installed to /etc/nginx/core-site-extras/cappyworld/mp.conf; the cappyworld site vhost includes it.
# The park lobby (cappy-park.service) answers the game's /mp/ requests.
location /mp/ {
    proxy_pass http://127.0.0.1:9201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
}
