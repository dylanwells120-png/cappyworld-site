<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140818">
  <title>Gallery — CappyWorld</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body data-page="gallery">
  <header class="site-header">
    <a class="brand" href="../"><img src="../favicon.svg" alt=""> CappyWorld</a>
    <nav class="nav" aria-label="Site">
      <a data-nav="home" href="../">Home</a>
      <a data-nav="play" href="../play/">Play</a>
      <a data-nav="gallery" href="./">Gallery</a>
      <a data-nav="announcements" href="../announcements/">Announcements</a>
    </nav>
  </header>
  <main class="wrap">
    <header class="page-intro">
      <p class="kicker">From this web build</p>
      <h1 class="section-title">Gallery</h1>
      <p>These are captures of the CappyWorld three.js game in this repo, at Halloween dusk. They are not stand-in art.</p>
    </header>
    <div class="gallery-grid">
      <figure class="shot">
        <img src="title-menu.jpg" alt="CappyWorld Halloween title menu over the park" width="1280" height="720">
        <figcaption>
          <h2>Title menu</h2>
          <p>The Halloween start screen. Play, or open clothes you have already found.</p>
        </figcaption>
      </figure>
      <figure class="shot">
        <img src="mochis-home.jpg" alt="Mochi the capybara standing in the fenced home park at dusk" width="1280" height="720">
        <figcaption>
          <h2>Mochi's home</h2>
          <p>The park you start in, with the ruckus score and the way north toward the village.</p>
        </figcaption>
      </figure>
      <figure class="shot">
        <img src="village-square.jpg" alt="The village square at Halloween dusk, with paths and trees" width="1280" height="720">
        <figcaption>
          <h2>Village square</h2>
          <p>North of home. Neighbors, the notice board, and the lanes around the square.</p>
        </figcaption>
      </figure>
      <figure class="shot">
        <img src="pumpkin-meadow.jpg" alt="The pumpkin meadow east of home, with pumpkins on the ground" width="1280" height="720">
        <figcaption>
          <h2>Pumpkin meadow</h2>
          <p>East of the park. Pumpkins and hay bales are there to knock over.</p>
        </figcaption>
      </figure>
      <figure class="shot">
        <img src="haunted-forest.jpg" alt="The haunted house in Whispering forest" width="1280" height="720">
        <figcaption>
          <h2>Whispering forest</h2>
          <p>Across the river, the haunted house. Step through the door when you want to go inside.</p>
        </figcaption>
      </figure>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">CappyWorld · Stills from the playable web build</div>
  </footer>
  <script src="../js/site.js"></script>
</body>
</html>
